version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    profiles: ["full", "kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"
    volumes:
      - kafka-data-dev:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dedup_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dedup_worker
    profiles: ["full", "services"]
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-dedup_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dedup_password}
      - POSTGRES_DB=${POSTGRES_DB:-dedup_db}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-reclamation_processing}
      - KAFKA_DLQ_TOPIC=${KAFKA_DLQ_TOPIC:-dead_letter_topic}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-dedup_workers}
      - LABSE_MODEL=${LABSE_MODEL:-sentence-transformers/LaBSE}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
      - THRESHOLD_AUTO_DUPLICATE=${THRESHOLD_AUTO_DUPLICATE:-0.85}
      - THRESHOLD_REVIEW=${THRESHOLD_REVIEW:-0.70}
      - TIME_WINDOW_DAYS=${TIME_WINDOW_DAYS:-7}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dedup_network

  pg_listener:
    build:
      context: .
      dockerfile: Dockerfile.pg_listener
    container_name: dedup_pg_listener
    profiles: ["full", "services"]
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-dedup_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dedup_password}
      - POSTGRES_DB=${POSTGRES_DB:-dedup_db}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-reclamation_processing}
      - KAFKA_DLQ_TOPIC=${KAFKA_DLQ_TOPIC:-dead_letter_topic}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-dedup_workers}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dedup_network

  # Uncomment if you want to run PostgreSQL in Docker
  # postgres:
  #   image: pgvector/pgvector:pg15
  #   container_name: dedup_postgres
  #   environment:
  #     POSTGRES_USER: dedup_user
  #     POSTGRES_PASSWORD: dedup_password
  #     POSTGRES_DB: dedup_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./migrations:/docker-entrypoint-initdb.d
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U dedup_user -d dedup_db"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - dedup_network

volumes:
  kafka-data-dev:
    name: kafka-data-dev
  # postgres_data:

networks:
  dedup_network:
    driver: bridge
